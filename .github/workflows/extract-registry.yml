# A manual dispatch that runs the extraction rather than the suite: it loads the extractor beside
# the Integrated mods it is asked for and writes the registry JSON the docs build consumes.
#
# Repo-owned on purpose. kirjorjos/ci syncs the checks every pull request runs, and its templates
# carry nothing for a tool a maintainer starts by hand, so this file is neither shared nor
# overwritten on a sync.
name: Extract registry

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: "Minecraft line to extract for: empty means this branch's, otherwise <version>/development is used."
        required: false
        default: ""
      mods:
        description: "Integrated mods to load: all (the whole suite), vanilla, or comma-separated slugs."
        required: false
        default: all
      locale:
        description: "Locales to emit: empty keeps today's single file, all for the eleven docs locales, or comma-separated docs codes (fr_FR)."
        required: false
        default: ""
      output_path:
        description: "Path inside the target repository this run updates; it has to already exist there."
        required: false
        default: ""
      mode:
        description: "Upload the file as an artifact, or commit it to the target repository."
        required: false
        type: choice
        options:
          - artifact
          - commit
        default: artifact
      target_repo:
        description: "owner/name a commit-mode run writes to."
        required: false
        default: kirjorjos/Unofficial-Integrated-Dynamics-Docs-and-Tools
      target_ref:
        description: "Branch in the target repository the commit lands on."
        required: false
        default: main

permissions:
  contents: read
  # The mod set is the CyclopsMC deobf artifacts on GitHub Packages: the plain jars are production
  # jars and cannot be loaded by the harness's development client.
  packages: read

concurrency:
  group: extract-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    name: Extract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use the requested Minecraft line
        id: mc
        env:
          REQUESTED: ${{ inputs.minecraft_version }}
        run: |
          set -euo pipefail
          declared="$(sed -n 's/^minecraft_version *= *\([^[:space:]]*\).*/\1/p' gradle.properties | head -1)"
          version="${REQUESTED:-$declared}"
          if [ -z "$version" ]; then
            echo "::error::no minecraft_version input and this branch's gradle.properties declares none"
            exit 1
          fi

          # One branch per Minecraft line, so asking for another line means reading that branch:
          # its extractor, its harness pin and its mods are the ones that belong to the version.
          if [ "$version" != "$declared" ]; then
            if ! git ls-remote --exit-code --heads origin "${version}/development" > /dev/null; then
              echo "::error::no ${version}/development branch, so ${version} cannot be extracted for"
              exit 1
            fi
            git fetch --quiet --depth 1 origin "${version}/development"
            git checkout --quiet -B "extraction-${version}" FETCH_HEAD
            declared="$(sed -n 's/^minecraft_version *= *\([^[:space:]]*\).*/\1/p' gradle.properties | head -1)"
            if [ "$declared" != "$version" ]; then
              echo "::error::${version}/development declares minecraft_version ${declared:-nothing}"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "extracting for Minecraft $version from $(git rev-parse --abbrev-ref HEAD)"

      - name: Fetch the mod set
        env:
          SELECT: ${{ inputs.mods }}
          MC: ${{ steps.mc.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bash tests/minecheck/fetch-mods.sh
          --select "$SELECT" --minecraft "$MC" --dest build/extraction/mods

      - name: Run the extraction
        env:
          MODS_EXTRA_DIR: build/extraction/mods
          SCRIPT: extract-registry.lua
          OUTPUT_FILE: extractor-registry.json
          REPORT_DIR: build/extraction/run
          LOCALES: ${{ inputs.locale }}
        run: bash tests/minecheck/run.sh

      - name: Name the artifact
        id: artifact
        env:
          LOCALES: ${{ inputs.locale }}
          MC: ${{ steps.mc.outputs.version }}
        run: |
          set -euo pipefail
          LOCALES="$(printf '%s' "$LOCALES" | tr -d '[:space:]')"
          if [ -z "$LOCALES" ]; then
            name="registry-extraction-$MC"
          else
            name="registry-extraction-$MC-${LOCALES//,/+}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload the extraction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            build/extraction/run/client/extractor-*.json
            build/extraction/run/client/logs/latest.log
            build/extraction/mods/mods.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Commit the extraction
        if: inputs.mode == 'commit'
        env:
          TOKEN: ${{ secrets.EXTRACTION_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_REF: ${{ inputs.target_ref }}
          OUTPUT_PATH: ${{ inputs.output_path }}
          MC: ${{ steps.mc.outputs.version }}
          LOCALES: ${{ inputs.locale }}
          DEFAULT_SOURCE: build/extraction/run/client/extractor-registry.json
        run: |
          set -euo pipefail
          LOCALES="$(printf '%s' "$LOCALES" | tr -d '[:space:]')"
          # One commit updates one file, so a multi-locale run has no single path to write to: name a
          # single locale, or dispatch once per locale.
          case "$LOCALES" in
              "") SOURCE="$DEFAULT_SOURCE" ;;
              all|*,*)
                  echo "::error::commit mode updates one file: set locale to a single code, or leave it empty"
                  exit 1
                  ;;
              *) SOURCE="build/extraction/run/client/extractor-registry-${LOCALES}.json" ;;
          esac
          : "${TOKEN:?commit mode needs the EXTRACTION_TOKEN secret: contents: write on the target repository}"
          : "${OUTPUT_PATH:?commit mode needs output_path: the file in $TARGET_REPO this run updates}"
          case "$OUTPUT_PATH" in
              /*|..*|*/../*)
                  echo "::error::output_path must be a relative path inside $TARGET_REPO"
                  exit 1
                  ;;
          esac
          if [ ! -f "$SOURCE" ]; then
              echo "::error::this run wrote no $SOURCE"
              exit 1
          fi

          echo "::add-mask::$TOKEN"
          work="$(mktemp -d)"
          git clone --quiet --depth 1 --branch "$TARGET_REF" \
              "https://x-access-token:$TOKEN@github.com/$TARGET_REPO.git" "$work/target"

          # The dispatch updates a registry that is already committed; a path that does not exist is
          # a wrong input, not a file to create, so it fails before anything is written.
          if [ ! -f "$work/target/$OUTPUT_PATH" ]; then
              echo "::error::$TARGET_REPO@$TARGET_REF has no $OUTPUT_PATH: this dispatch updates a committed registry, it does not create one"
              exit 1
          fi
          install -m 644 "$SOURCE" "$work/target/$OUTPUT_PATH"

          cd "$work/target"
          if git diff --quiet -- "$OUTPUT_PATH"; then
              echo "::notice::$OUTPUT_PATH already matches this run; nothing committed"
              exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$OUTPUT_PATH"
          git commit -m "chore: update $OUTPUT_PATH for Minecraft $MC"
          git push --quiet origin "HEAD:$TARGET_REF"
