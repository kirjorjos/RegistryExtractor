# The Minecraft version this branch builds against: one branch per MC version.
minecraft_version=1.19.2

# The licence identifier the loader metadata declares, substituted into mods.toml at build time.
# LICENSE.txt holds the text; this holds the identifier, and there being one copy of it is the point.
licence=GPL-3.0-only

# Enough memory for the Minecraft decompilation step.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
