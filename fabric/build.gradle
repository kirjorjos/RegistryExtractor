plugins {
    id 'fabric-loom' version '0.12.12'
}

archivesBaseName = 'registry-extractor-fabric'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

dependencies {
    minecraft "com.mojang:minecraft:1.18.2"
    // Mojang official mappings, matching the Forge module, so the ported sources keep their names.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.20.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.77.0+1.18.2"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}
