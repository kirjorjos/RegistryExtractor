// The deobf mod jars carry the development view of their code: libraries the published jar relocates
// into itself are declared as classpath entries in the mod's own dev run (`modLib`), not bundled. A
// client loading those jars needs them the same way, and a library dropped into mods/ has no mod
// metadata, so Forge would skip it. They are added as this run's runtime dependencies as soon as the
// mod project's plugin creates its configurations — Minecheck resolves some while configuring, so
// projectsEvaluated is too late.
gradle.beforeProject { project ->
    def runtimeLibs =
        (project.findProperty('minecheck.extractor.runtimeLibs') ?: '')
            .split(',').collect { it.trim() }.findAll { it }
    if (runtimeLibs.isEmpty()) {
        return
    }
    project.pluginManager.withPlugin('xyz.wagyourtail.unimined') {
        project.repositories { mavenCentral() }
        runtimeLibs.each { project.dependencies.add('runtimeOnly', it) }
        project.logger.lifecycle(
            "Minecheck: client classpath libraries — ${runtimeLibs.join(', ')} in ${project.path}")
    }
}

gradle.projectsEvaluated {
    def root = gradle.rootProject

    def taskName = root.findProperty('minecheck.extractor.task') ?: 'testForge'

    def target = root.tasks.findByName(taskName)
    if (target == null) {
        return
    }
    def scriptsDir = root.findProperty('minecheck.extractor.scriptsDir')
    def runDir = root.findProperty('minecheck.extractor.runDir')
    def scriptName = root.findProperty('minecheck.extractor.script') ?: 'extractor-client.lua'
    def serverScript = root.findProperty('minecheck.extractor.serverScript')

    if (scriptsDir == null || runDir == null) {
        throw new GradleException(
            'minecheck.extractor.scriptsDir and minecheck.extractor.runDir must both be set with -P')
    }

    target.script.set(scriptName)
    target.scriptsDir.set(scriptsDir)
    target.runDir.set(runDir)

    target.coordinator.set(null as String)
    if (serverScript) {
        target.serverScript.set(serverScript)
    } else {
        target.serverScript.set(null as String)
    }

    // Nothing else is attached here: the post-run assertions are a task in the extractor's own build,
    // finalized by `testForgeAll` there. They read the files run.sh copies back, so they need neither
    // this build's project nor a second Gradle invocation inside it.
    root.logger.lifecycle(
        "Minecheck: extractor suite wired — task=${taskName} script=${scriptName} scriptsDir=${scriptsDir}")
}
